<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>网络异常</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            text-align: center;
        }

        .message {
            margin-top: 100px;
            padding: 30px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="message">
        <h2>网络连接异常</h2>
        <p>请检查网络连接后刷新页面</p>
        <button onclick="location.reload()">刷新页面</button>
    </div>
</body>

</html>
